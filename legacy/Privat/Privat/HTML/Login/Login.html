<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Precision Engineering Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/Privat/CSS/Login.css">
</head>
<body>
    <!-- Background Elements -->
    <div class="bg-pattern"></div>
    <div class="particles" id="particles"></div>

    <!-- Login Container -->
    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <div class="logo-container">
                <div class="logo-icon">
                    <i class="fas fa-cogs"></i>
                </div>
                <h1>Precision Engineering</h1>
                <p>Admin Panel Access</p>
            </div>
        </div>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">Invalid credentials. Please try again.</span>
        </div>

        <!-- Login Form -->
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-with-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" 
                           id="username" 
                           class="form-control" 
                           placeholder="Enter your username" 
                           required
                           autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" 
                           id="password" 
                           class="form-control" 
                           placeholder="Enter your password" 
                           required
                           autocomplete="current-password">
                    <button type="button" class="password-toggle" id="togglePassword">
                    
                    </button>
                </div>
            </div>



            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                Sign In to Dashboard
            </button>
        </form>


    </div>

    <script src="/Privat/JS/Login.js"></script>
</body>
</html>
