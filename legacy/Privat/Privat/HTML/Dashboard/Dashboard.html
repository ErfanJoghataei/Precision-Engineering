<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Precision Engineering</title>
  <link rel="stylesheet" href="/Public/CSS/style.css">
  <link rel="stylesheet" href="/Privat/CSS/Admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-layout">
  
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <h2><i class="fas fa-cogs"></i> Admin Panel</h2>
      <p class="admin-subtitle">Precision Engineering</p>
    </div>
    
    <nav class="sidebar-nav">
      <a data-page="dashboard" class="nav-item active">
        <i class="fas fa-tachometer-alt"></i> Dashboard
      </a>
      <a data-page="blogs" class="nav-item">
        <i class="fas fa-blog"></i> Blogs
      </a>
      <a data-page="projects" class="nav-item">
        <i class="fas fa-project-diagram"></i> Projects
      </a>
      <a data-page="downloads" class="nav-item">
        <i class="fas fa-download"></i> Downloads
      </a>
      <a data-page="messages" class="nav-item">
        <i class="fas fa-envelope"></i> Messages
        <span class="badge">3</span>
      </a>

      <a data-page="settings" class="nav-item">
        <i class="fas fa-cog"></i> Settings
      </a>
      
      <div class="sidebar-footer">
        <a href="/" class="nav-item" target="_blank">
          <i class="fas fa-external-link-alt"></i> View Site
        </a>
        <a class="nav-item logout-btn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </a>
      </div>
    </nav>
  </aside>
  
  <!-- Main Content -->
  <main class="admin-main">
    <!-- Topbar -->
    <header class="admin-topbar">
      <div class="topbar-left">
        <button class="menu-toggle">
          <i class="fas fa-bars"></i>
        </button>
        <h1 id="page-title">Dashboard</h1>
      </div>

    </header>
    
    <!-- Content Area -->
    <section id="admin-content">
      <!-- محتوای هر صفحه اینجا لود میشه -->
      <div class="page-content" id="content-area">
        <!-- Dashboard content will be loaded here -->
      </div>
    </section>
  </main>

  <!-- Modals will be inserted here dynamically -->
  <div id="modal-container"></div>

  <!-- Scripts -->
  <script src="/Privat/JS/Dashboard.js"></script>
  <script src="https://cdn.ckeditor.com/ckeditor5/38.0.1/classic/ckeditor.js"></script>
</body>
</html>
